# Honda CL250 role map for the D-083 stage-1 physics estimators.
# Names are validated against the pinned vehicle-defs submodule on load.
# Change this file, not library code, when a vehicle signal differs.

[roles]
engine_speed = "did.ENGINE_SPEED"
vehicle_speed = "did.VEHICLE_SPEED"
coolant_temp = "did.COOLANT_TEMP"
battery_voltage = "did.BATTERY_VOLTAGE"
gear_estimate = "derived.gear_estimate"
gearbox_ratio_measured = "derived.gearbox_ratio_measured"

# Estimator -> signal group used in the rule-3 attribution.
[groups]
cooling = "cooling"
charging = "charging"
gearing = "longitudinal"

# Operating-point proxies for the stage-2 holdout split. These are existing roles,
# never defs signal literals in library code; the values are medians of recorded data.
[operating_point]
temperature = "coolant_temp"
load = "engine_speed"
